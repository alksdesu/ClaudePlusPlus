name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # tag push: build installers and publish a GitHub Release
      - name: Build and publish release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Claude++ ${{ github.ref_name }}"
          releaseBody: |
            Windows 安装包、免安装 exe 与 macOS dmg 见下方 Assets。
            Windows installer, portable exe and macOS dmg are attached under Assets.
          releaseDraft: false
          prerelease: false

      - name: Attach portable exe
        if: github.ref_type == 'tag' && matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          Copy-Item src-tauri/target/release/claude-plus-plus.exe "claude-plus-plus_${ver}_portable.exe"
          gh release upload ${{ github.ref_name }} "claude-plus-plus_${ver}_portable.exe" --clobber

      # manual run: build only, keep artifacts on the workflow for preview
      - name: Build without publishing
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload preview artifacts (Windows)
        if: github.ref_type != 'tag' && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: claude-plus-plus-preview-windows
          path: |
            src-tauri/target/release/claude-plus-plus.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload preview artifacts (macOS)
        if: github.ref_type != 'tag' && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: claude-plus-plus-preview-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
