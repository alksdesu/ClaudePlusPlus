[package]
name = "claude-plus-plus"
version = "0.4.1"
edition = "2021"
license = "AGPL-3.0-only"

[workspace]

[lib]
name = "claude_plus_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "claude-plus-plus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
dirs = "6"
filetime = "0.2"
memchr = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
trash = "5"
uuid = { version = "1", features = ["v4", "v5"] }

[target.'cfg(windows)'.dependencies]
junction = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
