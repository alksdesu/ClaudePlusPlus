[package]
name = "claude-plus-plus"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace]

[lib]
name = "claude_plus_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "claude-plus-plus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
dirs = "6"
junction = "1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
trash = "5"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
